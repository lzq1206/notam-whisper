name: Update Upcoming Rocket Launches

on:
  schedule:
    - cron: "13 */3 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "fetch_upcoming_launches.py"
      - ".github/workflows/update_upcoming_launches.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Fetch upcoming launches
        run: python fetch_upcoming_launches.py
      - name: Commit updated snapshot if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[Auto] Update upcoming rocket launches"
          file_pattern: "upcoming_launches.json"
          branch: main
